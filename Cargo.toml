[package]
name = "codehead"
version = "0.3.0"
edition = "2024"
publish = false
description = "write the task, pick named agents, follow and steer the thread: agent work in 1 terminal"
license = "Apache-2.0"
repository = "https://github.com/hansfuchs/codehead"
homepage = "https://codehead.sh"
readme = "README.md"

[dependencies]
libc = "0.2"
ratatui = "0.30"
regex = { version = "1.13.1", default-features = false, features = [
  "std",
  "perf",
  "unicode-perl",
] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
toml_edit = "0.25.19"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
unicase = "2.10"
two-face = { version = "0.5.2", default-features = false, features = [
  "syntect-default-onig",
] }
keyring = "4.2.0"
hyperpolyglot = "0.1.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui-image = { version = "11.1", default-features = false }
notify = "9"

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[profile.release]
strip = true

# hyperpolyglot 0.1.7 with `pub mod detectors` (classify a paste without a file)
[patch.crates-io]
hyperpolyglot = { path = "vendor/hyperpolyglot" }

[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cognitive_complexity = "warn"
dbg_macro = "warn"
excessive_nesting = "warn"
min_ident_chars = "warn"
self_named_module_files = "warn"
todo = "warn"
