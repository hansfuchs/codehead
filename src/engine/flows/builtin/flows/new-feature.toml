name = "new feature"
description = "scrutinize, plan, gate, build, review, report"
roles = ["lead", "reviewer"]

[[step]]
use = "scrutinize-task"

[[step]]
use = "open-questions"

[[step]]
id = "plan"
use = "plan"

[[step]]
use = "owner-gate"
label = "plan approval"
gate = { changes = "plan" }

[[step]]
use = "implement"

[[step]]
use = "verify"

[[step]]
id = "review"
use = "peer-review"

[[step]]
use = "address-review"
loop = { to = "review", until = "the reviewer reports 0 findings of severity medium or higher", max = 3 }

[[step]]
use = "report"
