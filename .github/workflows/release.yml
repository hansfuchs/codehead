name: release

# A green main is a release. Each push that changes the app runs CI, builds 4 targets and
# publishes GitHub release v<version>; the install script and `codehead --update` take the
# newest one. Version: scripts/version.sh.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', 'notes/**', '**.md']

# a newer push supersedes a running release: only the newest main gets published.
# `gh release create` with assets publishes a draft only after every upload: a cancel
# mid-publish leaves at most a draft, never a "latest" without its binaries.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: meta
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

  binaries:
    name: binary ${{ matrix.runner }}
    needs: [checks, meta]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # oldest Ubuntu runners: the binaries need the oldest glibc
          - { runner: ubuntu-22.04, targets: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, targets: aarch64-unknown-linux-gnu }
          # 1 macOS job (macOS minutes cost the most): arm64 runner, x86_64 cross-compiled on it
          - { runner: macos-15, targets: aarch64-apple-darwin x86_64-apple-darwin }
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustup target add ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
      - run: scripts/stamp.sh ${{ needs.meta.outputs.version }}
      - run: for t in ${{ matrix.targets }}; do cargo build --release --target "$t"; done
      - run: for t in ${{ matrix.targets }}; do scripts/package.sh ${{ needs.meta.outputs.version }} "$t"; done
      # provenance: the install script runs `gh attestation verify` on it when gh is logged in
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: codehead-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.runner }}
          path: codehead-*.tar.gz*

  publish:
    needs: [meta, binaries]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: |
          printf '%s\n\n```sh\ncurl -fsSL https://codehead.sh/install | sh    # or: codehead --update\n```\n' "$(git log -1 --format=%B)" > notes.md
          gh release create "v$V" out/* --title "codehead $V" --notes-file notes.md --target "$GITHUB_SHA" --latest
