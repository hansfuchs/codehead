name: ci

# Pull requests, and every release before its builds. The site: site.yml (only on site changes).
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS: arm64 (faster than Intel: fewer of the costly macOS minutes)
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # lints: the same on every OS, Linux only
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: clippy, warnings fail
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
